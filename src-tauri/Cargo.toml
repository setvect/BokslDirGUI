[package]
name = "boksldir-gui"
version = "0.1.0"
description = "BokslDirGUI desktop file manager"
authors = ["setvect <setvect@naver.com>"]
edition = "2021"
rust-version = "1.93"

[[bin]]
name = "BokslDirGUI"
path = "src/main.rs"

[lib]
name = "boksldir_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 이미지 디코딩 없이 촬영 EXIF와 픽셀 크기를 읽는 전용 Rust 파서.
kamadak-exif = "0.6.1"
imagesize = "0.14.0"

# OS 복원 정보와 플랫폼별 휴지통 처리를 위해 전용 구현을 사용한다.
trash = "5.2.9"
# Tauri의 기존 전이 의존성 재사용: OS 홈/설정 경로와 파일 동일성 비교.
dirs = "6.0.0"
same-file = "1.0.6"
# TAR 계열을 OS 도구 없이 스트리밍 처리. ZIP/7z 암호 호환성은 동봉 도구 유지.
tar = "0.4.46"
flate2 = "1.1.9"
zstd = "0.13.3"
# PowerShell의 UTF-16 명령을 인수 해석 없이 전달, 기존 전이 의존성 재사용.
base64 = "0.22.1"
# Watchexec의 검증된 Job Object/프로세스 그룹 경계로 자식 트리 취소 지원.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "creation-flags", "job-object", "process-group"] }

# Windows 드라이브 및 재파싱 지점 검증에 필요한 최소 OS API.
[target.'cfg(windows)'.dependencies]
# Tauri 전이 의존성과 동일한 Windows 바인딩으로 Shell COM API 사용.
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# COM 콜백 구현 매크로가 직접 참조하는 기존 Windows 바인딩 버전.
windows-core = "0.61.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }

# Tauri가 이미 사용하는 objc2 바인딩으로 macOS 연결 앱 목록 조회.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSFileManager", "NSError"] }
