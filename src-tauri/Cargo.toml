[package]
name = "boksldir-gui"
version = "0.1.0"
description = "BokslDirGUI desktop file manager"
authors = ["setvect <setvect@naver.com>"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "BokslDirGUI"
path = "src/main.rs"

[lib]
name = "boksldir_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# OS 복원 정보와 플랫폼별 휴지통 처리를 위해 전용 구현을 사용한다.
trash = "5.2.9"

# Tauri가 이미 사용하는 objc2 바인딩으로 macOS 연결 앱 목록 조회.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSFileManager"] }
